<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="common/include/include-meta"/>
  <title>해커톤평가체계</title>
  <th:block th:include="common/include/include-link"/>
</head>
<body>
<div class="w-100 h-100 d-flex flex-column align-items-center justify-content-center px-4">
  <h1 class="fs-1" th:text="${apiException.getStatus()}" >STATUS</h1>
  <p class="mt-5 fw-bold" th:text="${apiException.getMessage()}">MESSAGE</p>
  <p class="mt-3 fw-bold" th:text="${apiException.getTimestamp()}">TIMESTAMP</p>
  <a th:href="@{#}" onclick="history.back()" class="mt-5 text-dark text-decoration-none border border-4 py-3 px-4 border-dark fw-bold mb-4">이전페이지로</a>
</div>
<th:block th:include="common/include/include-script"/>
</body>
</html>

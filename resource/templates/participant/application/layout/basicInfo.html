<div class="row mt-5 justify-content-center">
  <div class="col-sm-12 col-md-6 px-md-5">
    <div class="position-relative mb-4 pt-3">
      <label for="contest-field" class="mb-3 form-label-font">분야<span class="text-danger">*</span></label>
      <span class="invalid-feedback d-inline">지정공모 지원시 세부내용 확인필수</span>
      <select id="contest-field" name="contest-field" class="form-select form-select-md mb-3" aria-label="Default select example" data-toggle="tooltip" data-placement="bottom">
        <option value="select">선택</option>
        <option th:each="fieldItem : ${T(mil.af.domain.enums.ContestField).values()}"
                th:if="${fieldItem.getKrName()} != '지정공모(전체)'"
                th:value="${fieldItem}"
                th:text="${fieldItem.getKrName() + ' '+ fieldItem.getDescription()}">
        </option>
      </select>
      <span id="contest-field-invalid-feedback" class="invalid-tooltip"></span>
    </div>

    <div class="position-relative mb-4 pt-3">
      <label for="team-name" class="mb-3 form-label-font">팀명<span class="text-danger">*</span></label>
      <span id="team-name-duplicate-feedback" class="invalid-feedback d-inline"></span>
      <input id="team-name" name="team-name" class="form-control form-control-md mb-3" type="text" placeholder="영문/한글/숫자 1자~20자">
      <span id="team-name-invalid-feedback" class="invalid-tooltip"></span>
    </div>

    <div class="position-relative mb-4 pt-3">
      <label for="project-name" class="mb-3 form-label-font">프로젝트명<span class="text-danger">*</span></label>
      <input id="project-name" name="project-name" class="form-control form-control-md mb-3" type="text">
      <span id="project-name-invalid-feedback" class="invalid-tooltip"></span>
    </div>

  </div>
  <div class="col-sm-12 col-md-6 px-md-5">
    <div class="position-relative mb-4 pt-3">
      <label for="user-id" class="mb-3 form-label-font">ID<span class="text-danger">*</span></label>
      <span id="user-id-duplicate-feedback" class="invalid-feedback d-inline"></span>
      <input id="user-id" name="user-id" class="form-control form-control-md mb-3" type="text" placeholder="영문/숫자 5자~15자">
      <span id="user-id-invalid-feedback" class="invalid-tooltip"></span>
    </div>

    <div class="position-relative mb-4 pt-3">
      <label for="password" class="mb-3 form-label-font">비밀번호<span class="text-danger">*</span></label>
      <input id="password" name="password" class="form-control form-control-md mb-3" type="password" placeholder="영문/숫자/특수기호 포함 9자~20자">
      <span id="password-invalid-feedback" class="invalid-tooltip"></span>
    </div>

    <div class="position-relative mb-4 pt-3">
      <label for="password-check" class="mb-3 form-label-font">비밀번호 확인<span class="text-danger">*</span></label>
      <input id="password-check" name="password-check" class="form-control form-control-md mb-3" type="password" placeholder="영문/숫자/특수기호 포함 9자~20자">
      <span id="password-check-invalid-feedback" class="invalid-tooltip"></span>
    </div>
  </div>
</div>

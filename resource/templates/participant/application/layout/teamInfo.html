<div class="row mt-5 justify-content-center">
    <div class="col-sm-12 col-md-12 px-md-5">

        <div class="mb-3">
            <label class="form-label-font" style="vertical-align: middle;">팀원정보<span class="text-danger">*</span></label>
        </div>

        <div class="table-responsive">
            <table id="team-table" class="table table-responsive table-bordered">
                <thead class="table-light">
                <tr>
                    <th scope="col" class="team-th-seq">순번</th>
                    <th scope="col" class="team-th-rank">구분</th>
                    <th scope="col" class="team-th-rank-name">계급/직급</th>
                    <th scope="col" class="team-th-name">성명</th>
                    <th scope="col" class="team-th-birthday">생년월일</th>
                    <th scope="col" class="team-th-phone">전화번호</th>
                    <th scope="col" class="team-th-mail">메일</th>
                    <th scope="col" class="team-th-main-group">소속1</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i: ${#numbers.sequence(1, 4)}">
                    <th th:id="'member-sequence-' + ${i}" th:name="'member-sequence-' + ${i}" th:value="${i}" scope="row">
                        <span>
                            <input th:if="${i == 1}" th:id="'member-check-i' + ${i}"  class="form-check-input mt-0" type="checkbox" disabled readonly checked th:value="${i}">
                            <input th:unless="${i == 1}" th:id="'member-check-i' + ${i}"  class="form-check-input mt-0" type="checkbox" th:value="${i}" onclick="switchMemberInfoRow(event)" checked>
                        </span>
                        <span class="fw-bold text-primary" th:if="${i == 1}">팀장<span class="text-danger">*</span></span>
                        <span class="fw-bold" th:unless="${i == 1}">팀원</span>
                    </th>
                    <td>
                        <select th:id="'member-rank-' + ${i}" th:name="'member-rank-' + ${i}" class="form-select form-select-sm" aria-label="Default select example">
                            <option value="select">선택</option>
                            <option th:each="rankItem : ${T(mil.af.domain.enums.MemberRank).values()}"
                                    th:value="${rankItem}"
                                    th:text="${rankItem.getKrName()}"></option>
                        </select>
                    </td>
                    <td>
                        <input th:id="'member-rank-name-' + ${i}" th:name="'member-rank-name-' + ${i}" type="text" class="form-control form-control-sm" placeholder="계급/직급">
                    </td>
                    <td>
                        <input th:id="'member-name-' + ${i}" th:name="'member-name-' + ${i}" type="text" class="form-control form-control-sm" placeholder="홍길동">
                    </td>
                    <td>
                        <input th:id="'member-birthday-' + ${i}" th:name="'member-birthday-' + ${i}" type="date" max="9999-12-31" class="form-control form-control-sm">
                    </td>
                    <td>
                        <input th:id="'member-phone-' + ${i}" th:name="'member-phone-' + ${i} " type="tel" class="form-control form-control-sm" placeholder="010-1234-5678" oninput="addAutoHyphen(event)">
                    </td>
                    <td>
                        <input th:id="'member-mail-' + ${i}" th:name="'member-mail-' + ${i}" type="email" class="form-control form-control-sm" placeholder="example@email.com">
                    </td>
                    <td>
                        <input th:id="'member-main-group-' + ${i}" th:name="'member-main-group-' + ${i}" type="text" class="form-control form-control-sm" placeholder="부대/기관/학교">
                    </td>
<!--                    <td>
                        <input th:id="'member-sub-group-' + ${i}" th:name="'member-sub-group-' + ${i}" type="text" class="form-control form-control-sm" placeholder="대대/과">
                    </td>-->
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" style="height: auto;">
<head>
  <th:block th:include="common/include/include-meta"/>
  <!--  <th:block th:include="/common/include/csrf"/>-->
  <title>해커톤평가체계</title>
  <th:block th:include="common/include/include-link"/>
  <link rel="stylesheet" th:href="@{/css/participant/application.css}">
</head>
<body style="height: auto;">

<div>
  <div class="container">
    <form id="application-form" class="needs-validation">
      <div class="row mt-5 justify-content-center">
        <p class="text-center mb-5 mt-0 fs-5 fw-bold">
          제 <span th:text="${currentContestNum}">3</span>회 공군 『창의·혁신 아이디어 공모』 해커톤
        </p>
        <div class="col-sm-12 col-md-12 px-md-5">
          <label class="mb-3 fs-6">팀정보</label>
          <div class="table-responsive">
            <table class="table table-responsive table-bordered" style="font-size: 0.8rem;">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="team-th-seq">분야</th>
                  <th scope="col" class="team-th-rank">팀명</th>
                  <th scope="col" class="team-th-name">ID</th>
                  <th scope="col" class="team-th-birthday">프로젝트명</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div th:text="${applicationForm.getApplicationInfo().getContestField()}"></div>
                  </td>
                  <td>
                    <div th:text="${applicationForm.getTeamInfo().getTeamName()}"></div>
                  </td>
                  <td>
                    <div th:text="${applicationForm.getTeamInfo().getUserId()}"></div>
                  </td>
                  <td>
                    <div th:text="${applicationForm.getApplicationInfo().getProjectName()}"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!--  팀원정보 입력 섹션    -->
      <div class="row justify-content-center">
        <div class="col-sm-12 col-md-12 px-md-5">
          <label class="mb-3 fs-6">팀원정보</label>
          <div class="table-responsive">
            <table class="table table-responsive table-bordered" style="font-size: 0.8rem;">
              <thead class="table-light">
              <tr>
                <th scope="col" class="team-th-seq">순번</th>
                <th scope="col" class="team-th-rank">구분</th>
                <th scope="col" class="team-th-rank-name">계급</th>
                <th scope="col" class="team-th-name">성명</th>
                <th scope="col" class="team-th-birthday">생년월일</th>
                <th scope="col" class="team-th-phone">전화번호</th>
                <th scope="col" class="team-th-mail">메일</th>
                <th scope="col" class="team-th-main-group">소속1</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="memberInfo, i : ${applicationForm.getTeamInfo().getMemberInfoList()}">
                <th th:id="'member-sequence-' + ${i.index+1}" th:name="'member-sequence-' + ${i.index+1}" th:value="${i.index+1}" scope="row">
                  <!--              <span th:text="${i.index+1}"></span>-->

                  <span class="fw-bold text-primary" th:if="${i.index+1 == 1}">팀장</span>
                  <span class="fw-bold" th:unless="${i.index+1 == 1}">팀원</span>

                </th>
                <td>
                  <div th:id="'member-rank-' + ${i.index+1}" th:name="'member-rank-' + ${i.index+1}" class=""
                       th:text="${memberInfo.getRank()}"></div>
                </td>
                <td>
                  <div th:id="'member-rank-name-' + ${i.index+1}" th:name="'member-rank-name-' + ${i.index+1}" class=""
                       th:text="${memberInfo.getRankName()}"></div>
                </td>
                <td>
                  <div th:id="'member-name-' + ${i.index+1}" th:name="'member-name-' + ${i.index+1}" class=""
                       th:text="${memberInfo.getName()}"></div>
                </td>
                <td>
                  <div th:id="'member-birthday-' + ${i.index+1}" th:name="'member-birthday-' + ${i.index+1}" class=""
                       th:text="${memberInfo.getBirthday()}"></div>
                </td>
                <td>
                  <div th:id="'member-phone-' + ${i.index+1}" th:name="'member-phone-' + ${i.index+1} " class=""
                       th:text="${memberInfo.getPhone()}"></div>
                </td>
                <td>
                  <div th:id="'member-mail-' + ${i.index+1}" th:name="'member-mail-' + ${i.index+1}" class=""
                       th:text="${memberInfo.getMail()}"></div>
                </td>
                <td>
                  <div th:id="'member-main-group-' + ${i.index+1}" th:name="'member-main-group-' + ${i.index+1}" class=""
                       th:text="${memberInfo.getMainGroup()}"></div>
                </td>
<!--                <td>
                  <div th:id="'member-sub-group-' + ${i.index+1}" th:name="'member-sub-group-' + ${i.index+1}" class=""
                       th:text="${memberInfo.getSubGroup()}"></div>
                </td>-->
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!--  신청서 섹션  -->
      <div class="row justify-content-center">
        <div class="col-sm-12 col-md-12 px-md-5">
            <!--   인지 경로   -->
            <div class="row py-4 border mx-0">
              <div class="col-3 border-end d-flex align-items-center justify-content-center">
                <p class="h6 fw-bold text-center" >인지 경로</p>
              </div>
              <div class="col-9">
                <div class="position-relative row">
                  <div class="col-sm-12 col-md-12">
                    <span class="lh-base d-md-inline-block me-2" th:each="recognitionPath : ${applicationForm.getSurveyInfo().getRecognitionPathList()}" th:text="${recognitionPath}"
                          th:if="${recognitionPath} != '기타'"
                          style="font-size: 0.8rem;">
                    </span>
                    <span class="lh-base d-md-inline-block me-2" th:each="recognitionPath : ${applicationForm.getSurveyInfo().getRecognitionPathList()}"
                          th:text="|${recognitionPath}(${applicationForm.getSurveyInfo().getEtcDescription()})|"
                          th:if="${recognitionPath} == '기타'"
                          style="font-size: 0.8rem;">
                    </span>
                  </div>
                </div>
              </div>
            </div>

        </div>
      </div>

    </form>
  </div>
</div>
<th:block th:include="common/include/include-script"/>
</body>
</html>

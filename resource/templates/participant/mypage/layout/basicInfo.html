<div class="row mt-5 justify-content-center">
  <div class="col-sm-12 col-md-6 px-md-5">
    <div class="position-relative mb-4 pt-3">
      <label for="contest-field" class="mb-3 form-label-font">분야<span class="text-danger">*</span></label>
      <input id="contest-field" name="contest-field" class="fw-bold form-control form-control-md mb-3 form-control-plaintext text-center" type="text" disabled readonly
             th:value="${applicationForm.getApplicationInfo().getContestField()}">
    </div>

    <div class="position-relative mb-4 pt-3">
      <label for="team-name" class="mb-3 form-label-font">팀명<span class="text-danger">*</span></label>
      <input id="team-name" name="team-name" class="fw-bold form-control form-control-md mb-3 form-control-plaintext text-center" type="text"
             th:value="${applicationForm.getTeamInfo().getTeamName()}" disabled readonly>
    </div>

  </div>
  <div class="col-sm-12 col-md-6 px-md-5">
    <div class="position-relative mb-4 pt-3">
      <label for="user-id" class="mb-3 form-label-font">ID<span class="text-danger">*</span></label>
      <input id="user-id" name="user-id" class="fw-bold form-control form-control-md mb-3 form-control-plaintext text-center" type="text"
             th:value="${applicationForm.getTeamInfo().getUserId()}" disabled readonly>
    </div>

    <div class="position-relative mb-4 pt-3">
      <label for="project-name" class="mb-3 form-label-font">프로젝트명<span class="text-danger">*</span></label>
      <input id="project-name" name="project-name" class="fw-bold form-control form-control-md mb-3 form-control-plaintext text-center" type="text"
             th:value="${applicationForm.getApplicationInfo().getProjectName()}" disabled readonly>
    </div>
  </div>
</div>

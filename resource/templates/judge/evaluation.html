<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="common/include/include-meta"/>
  <title>해커톤평가체계</title>
  <th:block th:include="common/include/include-link"/>
  <link rel="stylesheet" th:href="@{/css/judge/evaluation.css}">
</head>
<body>
  <header th:replace="common/layout/judge-header"></header>
  <div th:replace="common/loading"></div>
  <div class="evaluation-content-container">
    <div class="container pb-4">
      <p class="location mt-5">
        심사위원
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
          <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
        </svg>
        <span style="color: #004abf">평가표</span>
      </p>
      <div class="row mt-5 justify-content-center">
        <div class="col-md-3 d-flex align-items-center justify-content-center border-end info-item fw-bold">공모분야 :&nbsp;<span class="fw-normal" th:text="${contestField}">공모분야</span></div>
        <div class="col-md-3 d-flex align-items-center justify-content-center border-end info-item fw-bold">팀명 :&nbsp;<span class="fw-normal" th:text="${teamName}">팀명</span></div>
        <div class="col-md-3 d-flex align-items-center justify-content-center border-end info-item fw-bold">과제명 :&nbsp;<span class="fw-normal" th:text="${projectName}">과제명</span></div>
        <div class="col-md-3 d-flex align-items-center justify-content-center info-item">
          <button type="button" class="btn btn-info text-white" onclick="location.href='/alr20/judge/progress?page=1&sort=progressStatus,asc&sort=totalScore,desc'">전체평가현황</button>
        </div>
      </div>
      <div class="row mt-4 justify-content-center">
        <div class="d-flex align-items-center justify-content-center info-item">
          <a class="btn btn-primary text-white" th:href="|/alr20/judge/evaluation/${teamId}/idea-plan-file|"
          th:text="|${teamName} 아이디어 기획서 보기|"
          target="_blank">아이디어 기획서 보기</a>
          <div class="col-md-3 d-flex align-items-center justify-content-center info-item fw-bold">총점 :&nbsp;<span class="fw-normal" th:text="${totalScore}">0.0</span></div>
        </div>
      </div>
      <div class="row mt-4 justify-content-center">
        <div class="col-sm-12 col-md-4 my-2">
          <!--    팀리스트 section    -->
          <div th:replace="judge/evaluation/layout/teamList :: teamList(${evaluationTableList})"></div>
        </div>
        <div class="col-sm-12 col-md-8 my-2">
          <!--    평가항목리스트 section    -->
          <div th:replace="judge/evaluation/layout/evaluationItemList :: evaluationItemList(${evaluationItemList})"></div>
        </div>
      </div>
      <div class="row my-5 justify-content-center">
        <div class="col-md-4 d-flex align-items-center justify-content-center border-end info-item fw-bold">직급(위) :&nbsp;<span class="fw-normal" th:text="${judgeRank}"></span></div>
        <div class="col-md-4 d-flex align-items-center justify-content-center border-end info-item fw-bold">성명 :&nbsp;<span class="fw-normal" th:text="${judgeName}"></span></div>
        <div class="col-md-3 d-flex align-items-center justify-content-center info-item">
          <button type="button" class="btn btn-primary text-white" value="저장" onclick="saveScore(event)">저장</button>
        </div>
      </div>
    </div>
  </div>
  <footer th:replace="common/layout/footer"></footer>
  <th:block th:include="common/include/include-script"/>
  <script th:src="@{/js/evaluation.js}"></script>
</body>
</html>

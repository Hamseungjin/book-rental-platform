<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:include="common/include/include-meta"/>
    <title>해커톤평가체계</title>
    <th:block th:include="common/include/include-link"/>
    <link rel="stylesheet" th:href="@{/css/judge/confirm.css}">
  </head>
  <body>
  <header th:replace="common/layout/judge-header"></header>
  <input id="initPasswordCheck" type="hidden" th:value="${initPassword}">
  <div class="confirm-content-container">
    <div class="container pb-4">
      <p class="location mt-5">
        심사위원
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
          <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
        </svg>
        <span style="color: #004abf">정보확인</span>
      </p>
      <div class="row mt-5 justify-content-center">
        <div class="col-sm-12 col-md-6">
          <label class="mb-3 form-label-font">소속</label>
          <input name="" readonly disabled class="form-control form-control-lg mb-3 form-control-plaintext text-center" type="text" th:value="${group}">
          <label class="mb-3 form-label-font">직급(위)</label>
          <input name="" readonly disabled class="form-control form-control-lg mb-3 form-control-plaintext text-center" type="text" th:value="${rank}">
          <label class="mb-3 form-label-font">성명</label>
          <input name="" readonly disabled class="form-control form-control-lg mb-3 form-control-plaintext text-center" type="text" th:value="${name}">
          <label class="mb-3 form-label-font">심사분야</label>
          <input name="" readonly disabled class="form-control form-control-lg mb-5 form-control-plaintext text-center" type="text" th:value="${contestField}">
          <button class="btn btn-primary btn-lg w-100 shadow mb-3" onclick="window.location.href='/alr20/judge/progress?page=1&sort=progressStatus,asc&sort=totalScore,desc'">확인</button>
          <!--  비밀번호 변경   -->
          <!-- Button trigger modal -->
          <button id="changePasswordButton" type="button" class="btn btn-info btn-lg w-100 text-white" data-bs-toggle="modal" data-bs-target="#exampleModal">
            비밀번호변경
          </button>
          <!-- Modal -->
          <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <form id="change-password-form" class="w-100">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="exampleModalLabel">비밀번호변경</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                    <div class="mb-3 position-relative">
                      <label for="change-password" class="col-form-label fw-bold">변경비밀번호  <span class="text-danger">*</span></label>
                      <input type="password" class="form-control" id="change-password" name="changePassword"
                             placeholder="영문/숫자/특수기호 포함 9자~20자">
                      <span id="change-password-invalid-feedback" class="invalid-tooltip"></span>
                    </div>
                    <div class="mb-3 position-relative">
                      <label for="change-password-check" class="col-form-label fw-bold">변경비밀번호 확인<span class="text-danger">*</span></label>
                      <input type="password" class="form-control" id="change-password-check" name="changePasswordCheck"
                             placeholder="영문/숫자/특수기호 포함 9자~20자">
                      <span id="change-password-check-invalid-feedback" class="invalid-tooltip"></span>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <input type="submit" class="btn btn-primary" onclick="changePasswordHandler(event)" value="변경하기">
                    <button type="button" class="btn btn-warning" data-bs-dismiss="modal">취소</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
          <p class="m-0 py-4 text-primary"
             th:text="|* 심사위원 개인정보변경 문의 : ${T(mil.af.domain.enums.AdminDepartment).NAME.getContent()} (${T(mil.af.domain.enums.AdminDepartment).TEL.getContent()})|">* 심사위원 개인정보변경 문의 : 공군미래기획센터 (042-552-XXXX)</p>
        </div>
      </div>
    </div>
  </div>
  <footer th:replace="common/layout/footer"></footer>
  <th:block th:include="common/include/include-script"/>
  <script th:src="@{/js/change-password.js}"></script>
  </body>
</html>

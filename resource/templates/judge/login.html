<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="common/include/include-meta"/>
  <title>해커톤평가체계</title>
  <th:block th:include="common/include/include-link"/>
</head>
<body>
  <header th:replace="common/layout/header"></header>
  <div th:replace="common/loading"></div>
  <div class="content-container">
    <div class="container pb-4">
      <p class="location">
        심사위원
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
          <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
        </svg>
        <span style="color: #004abf">로그인</span>
      </p>
      <div class="row mt-5 justify-content-center">
        <div class="col-sm-12 col-md-6">

          <form id="judge-login-form">
            <label for="user-id" class="mb-3 form-label-font">ID</label>
            <input id="user-id" name="userId" class="form-control form-control-lg mb-3" type="text" placeholder="아이디를 입력하세요.">
            <label for="password" class="mb-3 form-label-font">비밀번호</label>
            <input id="password" name="password" class="form-control form-control-lg" type="password" placeholder="비밀번호를 입력하세요.">
            <p id="judge-login-failure-message" class="m-0 pt-2 text-danger d-none">ID 또는 비밀번호가 일치하지 않습니다.</p>
            <input type="submit" class="btn btn-primary btn-lg w-100 shadow mt-4" value="확인" onclick="judgeLogin(event)">
            <p class="m-0 py-4"><a class="text-decoration-none"
                                   th:text="|* 심사위원 계정 관련 문의 : ${T(mil.af.domain.enums.AdminDepartment).NAME.getContent()} (${T(mil.af.domain.enums.AdminDepartment).TEL.getContent()})|">* 심사위원 계정 관련 문의 : 공군미래기획센터 (042-552-XXXX)</a></p>
          </form>
        </div>

      </div>
    </div>
  </div>
  <footer th:replace="common/layout/footer"></footer>
  <th:block th:include="common/include/include-script"/>
  <script th:src="@{/js/judge-login.js}"></script>
</body>
</html>

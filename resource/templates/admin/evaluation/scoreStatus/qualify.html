
<div class="tab-pane fade active show" id="bordered-qualifyScore">

    <div class="row">
            <div class="card-body" style="margin-top: 1.5rem;">
                <table id="qualifyScore" class="table table-hover text-break" style="width:100%">
                    <thead>
                        <tr>
                            <th>분야</th>
                            <th>팀명</th>
                            <th>프로젝트명</th>
                            <th>심사진행도</th>
                            <th>분야별순위</th>
                            <th class="no-sort">본선진출</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
    </div>
</div>

<script th:inline="javascript">
    $(document).ready(function(){

        $.fn.dataTable.Buttons.defaults.dom.button.className = 'btn';

        const addData = { findBy : "all" };

        let mainTeam = [[${mainTeamList}]];

        var table = $('#qualifyScore').DataTable( {
            dom: 'B<"#selectContestField">frtp',
            "responsive": true,
            "info": false,
            "lengthMenu": false,
            "lengthChange": false,
            "language": {
                "lengthMenu": "",
                "search": "팀명검색 :",
                "info": "",
                "paginate": {
                    "first": "처음",
                    "last": "마지막",
                    "next": "다음",
                    "previous": "이전"
                },
                "zeroRecords": "데이터가 없습니다"
            },
            "pagingType": "full_numbers",
            "searchDelay": 500,
            "serverSide": true,
            "processing": true,
            "bSort": true,

            "ajax": {
                "url": "/alr20/admin/evaluation/scoreStatus/qualify",
                "type": "POST",
                "dataType": "json",
                "contentType": "application/json; charset=utf-8",
                "data":
                    function (d) {
                        return JSON.stringify($.extend( {} , d, addData));
                    },
                "dataFilter":
                    function (response) {

                        if(JSON.parse(response).recordsTotal == 0 ){
                            $('#bordered-qualifyScore .excel').attr("disabled", true);
                            $('#saveQualify').attr("disabled", true);
                        }

                        console.log(JSON.parse(response));

                        return response;
                    }
            },

            "columns": [
                {"data" : "contestFieldString",
                    "render" : $.fn.dataTable.render.text(),
                    "width": "14%"},
                {"data" : "name",
                    "render" : $.fn.dataTable.render.text()},
                {"data" : "projectName",
                    "render" : $.fn.dataTable.render.text(),
                    "width": "24%"},
                {"data" : "percent",
                    "render": function(data,type, row, meta) {
                        return type === 'display' ?
                            '<div class="progress">' +
                                '<div class="progress-bar" role="progressbar" style="width:' + data + '%;" aria-valuenow="' + data + '" aria-valuemin="0" aria-valuemax="100">' + data + '%</div>' +
                            '</div>':data;
                    }
                },
                {"data" : "rank",
                    "render" : $.fn.dataTable.render.text()},
                {"data": null},
            ],

            "preDrawCallback": function(){
                $('.btn-group').removeClass('btn-group');
            },

            "drawCallback": function(){

                const check = ([[${isPreliminaryAllGrade}]].toString() === 'false');

                /*
                if( check ){
                    $('.check').attr("disabled", true);
                    $('#saveQualify').attr("disabled", true);
                }
                 */
            },

            "rowCallback": function(row, data){

                $(mainTeam).each(function(){
                    if(this.toString() === data.name){
                        $('td:eq(5) input', row).prop("checked", true);
                    }
                });

                if (data.contestRound === "MAIN"){
                    $('td input', row).prop("checked", true);
                }
            },

            columnDefs: [{
                bSortable: false, targets: 'no-sort'
            }, {
                'targets': 5,
                'searchable': false,
                'orderable': false,
                'className': 'dt-body-center',
                'render': function (data, type, full, meta){
                    return '<div class="form-check"><input class="form-check-input check" type="checkbox" id="qualification" value=""></div>';
                }
            }],

            buttons: [
                {
                    text: '<i class="fa fa-table"></i>EXCEL',
                    className: 'btn btn-success excel',
                    action: function(){
                        window.location = '/alr20/admin/download/preliminaryStatusExcel'
                    }
                },
                {
                    text: '<i class="fa fa-download"></i>결과저장',
                    className: 'btn btn-warning',
                    attr: {
                        id : 'saveQualify'
                    }
                }
            ],

        });

        let addOption = "";

        /*[# th:each="contestFieldType : ${contestFieldType}"]*/
        addOption += "<option value = \"" + [[${contestFieldType.key}]] + "\" >" + [[${contestFieldType.value}]] + "</option>";
        /*[/]*/

        $("#selectContestField").html('<select id="contestFilter" class="form-select form-select-sm" >' +
            '<option value="all">전체</option>' +
            addOption +
            '</select>');

        $('#selectContestField').on( 'change', function() {
            const value = $("#contestFilter option:selected").val();

            addData.findBy = value;

            table.ajax.reload();
        });

        let indicatorPrevious;
        $(document).on('focus', '#qualification', function(){
            indicatorPrevious = this.value;
        }).on('change','#qualification', function(){
            $('#qualification').trigger("blur");

            const name = $(this).parent().parent().parent().find("td").eq(1).text();

            if($(this).is(':checked')){
                mainTeam.push(name);
            } else {

                // $('input:checked').prop('checked', false);
                $(this).prop('checked', false);

                for(let i = 0; i<mainTeam.length; i++){
                    if(mainTeam[i] === name){
                        mainTeam.splice(i, 1);
                        i--;
                    }
                }

            }
        });

        $('#saveQualify').click(function(){

            if(confirm("해당 팀을 본선진출 팀으로 설정합니다")){

                const data = {mainRoundTeamList : mainTeam};

                console.log("보내는 데이터");
                console.log(JSON.stringify(data));

                $.ajax({
                    url: '/alr20/admin/set/main-round/team',
                    method:'POST',
                    data: JSON.stringify(data),
                    contentType: 'application/json; charset=utf-8',
                    success: function(res) {
                        alert(res.message);
                        location.reload();
                    },
                    error: function(res) {
                        alert(res.responseJSON.message);
                    }
                })
            }
        });

    });
</script>

<style>
    .btn-warning *{
        color: #fff;
    }

    #selectContestField {
        float: right;
        margin-left: 1rem;
    }

    .pagination {
        justify-content : center !important;
    }

    .tab-pane .row button{
        margin-right:inherit;
    }

    .btn-warning.disabled, .btn-warning:disabled {
        background-color: #9d9c9c;
        border-color: #9d9c9c;
    }

</style>

<div th:replace="admin/sideNav.html"></div>

<main id="main" class="main">

    <div class="pagetitle">
        <h1>평가표관리</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/main}"><i class="bi bi-house-door"></i></a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/evaluation/standard/final}">평가현황</a></li>
                <li class="breadcrumb-item active">본선평가표</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section dashboard">
        <div class="row">
            <div class="card">
                <div class="card-body" id="itemList">

                    <div class="container-fluid">

                        <div id="buttonGroup">
                            <button type="button" class="btn btn-primary" id="add"><i class="fa fa-plus"></i>추가</button>
                            <button type="button" class="btn btn-danger disabled" id="delete"><i class="fa fa-trash"></i>삭제</button>
                            <button type="button" class="btn btn-warning disabled" id="modify"><i class="fa fa-arrow-down"></i>수정</button>
                            <button type="button" class="btn btn-success" id="register"><i class="fa fa-paper-plane"></i>평가표갱신</button>
                            <button type="button" class="btn btn-dark disabled" id="order"><i class="fa fa-arrow-down"></i>순서변경</button>

                            <select id="designatedFilter" class="form-select" >
                                <option value="public">자유공모</option>
                                <option value="designated">지정공모</option>
                            </select>
                        </div>

                        <table id="evaluationTable" class="table table-hover table-bordered text-break" style="width:100%; text-align:center;">
                            <thead>
                            <tr class="table-dark">
                                <th class="no-sort">평가항목</th>
                                <th class="no-sort">평가지표</th>
                                <th class="no-sort">총점</th>
                                <th class="no-sort">편차</th>
                                <th class="no-sort">단계</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="list : ${final} ">
                                <td><span th:text="${list.name}"></span></td>
                                <td><span th:text="${list.description}"></span></td>
                                <td><span th:text="${list.point}"></span></td>
                                <td><span th:text="${list.differentialPoint}"></span></td>
                                <td><span th:text="${list.grade}"></span></td>
                            </tr>
                            </tbody>
                        </table>

                    </div>

                </div>
            </div>
        </div>
    </section>


</main><!-- End #main -->

<div th:replace="admin/evaluation/contest/modal/add.html"></div>
<div th:replace="admin/evaluation/contest/modal/delete.html"></div>
<div th:replace="admin/evaluation/contest/modal/order.html"></div>
<div th:replace="admin/evaluation/contest/modal/modify.html"></div>

<div th:replace="admin/footer.html"></div>

</div>


<script th:src="@{/js/admin/rowspan.js}"></script>

<script th:inline="javascript">
    $(document).ready(function () {

        $("table").rowspanizer({
            columns: [0]
        });

        {
            const option = [[${designatedFilter}]];

            $("#designatedFilter").val(option).prop("selected", true);

            $('#designatedFilter').on('change', function () {
                const value = $("#designatedFilter option:selected").val();
                location.href = "/alr20/admin/evaluation/standard/final/" + value;
            });
        }

        $('#add').click(function () {
            $('#bordered-insert-eval-item').modal('show');
        });

        let addOption = "";
        /*[# th:each="list : ${itemList}"]*/
        addOption += "<option value = \"" + [[${list}]] + "\" >" + [[${list}]] + "</option>";
        /*[/]*/

        if ([[${itemList}]].length != 0){
            $('#delete').removeClass('disabled');
            $('#modify').removeClass('disabled');
            $('#order').removeClass('disabled');
        }

        $('#delete').click(function () {
            $('#bordered-delete-eval-item').modal('show');
        });

        $('#modify').click(function() {
            $('#bordered-modify-eval-item').modal('show');
        });

        $('#order').click( function() {

            $('.indicatorList .row').remove();

            const defaultAdd = "<option value = \"none\" selected>" + "선택" + "</option>";

            $('#orderItem select').prepend(defaultAdd);

            let select2 = "";
            const check = $('#itemMenu option:selected').val();
            let count = 0;
            /*[# th:each="list : ${final}"]*/
            if ( [[${list.name}]] === check) {
                count++;
            }
            /*[/]*/

            for(let i = 0; i < count; i++){
                select2 += "<div class=\"row mb-3\">\n" +
                    "<label class=\"col-sm-4 col-form-label\">" +
                    (i+1) + "순위" +
                    "</label>\n" +
                    "<div class=\"col-sm-8\">\n" +
                    "<select class=\"form-select indicator\">\n" +
                    "</select>\n" +
                    "</div>\n" +
                    " </div>";
            }

            $('.indicatorList').append(select2);
            $('.indicatorList select').prepend(defaultAdd);

            $('#bordered-order-eval-item').modal('show');
        });

        let itemPrevious;
        $(document).on('focus', '#orderItem select', function(){
            itemPrevious = this.value;
        }).on('change','#orderItem select', function(){
            $('#orderItem select').trigger("blur");
            if(itemPrevious !== 'none'){
                if(this.value !== 'none'){
                    $('#orderItem select option[value="'+ itemPrevious + '"]').prop('disabled', false);
                    $('#orderItem select option[value="'+ this.value + '"]').prop('disabled', true);
                } else {
                    $('#orderItem select option[value="'+ itemPrevious + '"]').prop('disabled', false);
                }
            } else {
                $('#orderItem select option[value="'+ this.value + '"]').prop('disabled', true);
            }
        });

        let indicatorPrevious;
        $(document).on('focus', '.indicatorList select', function(){
            indicatorPrevious = this.value;
        }).on('change','.indicatorList select', function(){
            $('.indicatorList select').trigger("blur");
            if(indicatorPrevious !== 'none'){
                if(this.value !== 'none'){
                    $('.indicatorList select option[value="'+ indicatorPrevious + '"]').prop('disabled', false);
                    $('.indicatorList select option[value="'+ this.value + '"]').prop('disabled', true);
                } else {
                    $('.indicatorList select option[value="'+ indicatorPrevious + '"]').prop('disabled', false);
                }
            } else {
                $('.indicatorList select option[value="'+ this.value + '"]').prop('disabled', true);
            }
        });

        $("#orderCheckbox:checkbox").change(function() {
            if(this.checked) {
                $('.indicatorList select option').remove();

                const check = $('#itemMenu option:selected').val();

                const defaultAdd = "<option value = \"none\" selected>" + "선택" + "</option>";

                let addOption = "";
                /*[# th:each="list : ${final}"]*/
                if ( [[${list.name}]] === check) {
                    addOption += "<option value = \"" + [[${list.description}]] + "\" >" + [[${list.description}]] +"</option>";
                }
                /*[/]*/

                $('.indicatorList select').append(addOption);
                $('.indicatorList select').prepend(defaultAdd);
            }
        });

        ////평가지표 순서 변경 추가 필요
        $('#orderSubmit').click(function(){

            const isPublic = ($('#designatedFilter option:selected').val()==="public");
            let contestField;
            //지정공모, 자유공모 구분
            if(isPublic){
                contestField = "AIRSPACE";
            } else {
                contestField = "DESIGNATED_1";
            }

            if($('#orderCheckbox').attr("aria-expanded") === 'false'){

                let order = new Array();

                $('#orderItem select').each(function(){
                    order.push(this.value);
                });

                const data = {
                    orderList : order,
                    item : "",
                };

                $.ajax({
                    url:'/alr20/admin/evaluation/order/main/item/' + contestField,
                    method:'POST',
                    data: JSON.stringify(data),
                    contentType: 'application/json; charset=utf-8',
                    success: function(res) {
                        alert(res.message);
                        location.reload();
                    },
                    error: function(res) {
                        alert(res.responseJSON.message);
                    }
                });
            } else {
                const item = $('#itemMenu option:selected').val();

                let order = new Array();

                $('.indicatorList select').each(function(){
                    order.push(this.value);
                });

                const data = {
                    orderList : order,
                    item: item};

                $.ajax({
                    url:'/alr20/admin/evaluation/order/main/indicator/' + contestField,
                    method:'POST',
                    data: JSON.stringify(data),
                    contentType: 'application/json; charset=utf-8',
                    success: function(res) {
                        alert(res.message);
                        location.reload();
                    },
                    error: function(res) {
                        alert(res.responseJSON.message);
                    }
                })
            }
        });

        $('#itemMenu').change(function(){
            if( $("#orderCheckbox").prop("checked")  ){
                $('.indicatorList').toggle(250)
                $('.indicatorList .row').remove();

                const check = $('#itemMenu option:selected').val();

                let addOption = "";
                let count = 0;
                let select = "";
                /*[# th:each="list : ${final}"]*/
                if ( [[${list.name}]] === check) {
                    addOption += "<option value = \"" + [[${list.description}]] + "\" >" + [[${list.description}]] +"</option>";
                    count++;
                }
                /*[/]*/

                for(let i = 0; i < count; i++){
                    select += "<div class=\"row mb-3\">\n" +
                        "<label class=\"col-sm-4 col-form-label\">" +
                        (i+1) + "순위" +
                        "</label>\n" +
                        "<div class=\"col-sm-8\">\n" +
                        "<select class=\"form-select indicator\">\n" +
                        "</select>\n" +
                        "</div>\n" +
                        " </div>";
                }

                $('.indicatorList').append(select);
                $('.indicatorList').toggle(250);

                const defaultAdd = "<option value = \"none\" selected>" + "선택" + "</option>";

                $('.indicatorList select').append(addOption);
                $('.indicatorList select').prepend(defaultAdd);
            }
        });

        {
            const itemList = [[${itemList}]];

            if (itemList.length === 0){
                $('#addCheckbox').attr('disabled', true);
            }
        }

        $("#deleteCheckbox:checkbox").change(function() {
            if(this.checked) {
                const check = $('#deleteItem option:selected').val();

                /*[# th:each="list : ${final}"]*/
                if ( [[${list.name}]] !== check) {
                    $('#deleteIndicator').find('option[value="' + [[${list.description}]] + '"]').remove();
                }
                /*[/]*/
            }
        });

        $("#modifyCheckbox:checkbox").change(function() {
            if(this.checked) {
                const check = $('#modifyItem option:selected').val();
                let addOption = "";
                /*[# th:each="list : ${final}"]*/
                if ( [[${list.name}]] === check) {
                    addOption += "<option value = \"" + [[${list.description}]] + "\" >" + [[${list.description}]] +"</option>";
                }
                /*[/]*/
                $('#modifyIndicator').append(addOption);
                $('.item').removeClass('show');
                $('#indicatorss').addClass('show');
            } else {
                $('#modifyIndicator option').remove();
                $('.item').addClass('show');
                $('#indicatorss').removeClass('show');
            }
        });

        $('#modifySubmit').click(function() {

            let data;

            const isPublic = ($('#designatedFilter option:selected').val()==="public");
            let contestField;
            //지정공모, 자유공모 구분
            if(isPublic){
                contestField = "AIRSPACE";
            } else {
                contestField = "DESIGNATED_1";
            }
            const contestRound = "MAIN";

            if($('#modifyCheckbox').attr("aria-expanded") === 'false') {

                const name = $('#modifyItem option:selected').val();
                const newItem = $('#newItem').val();

                data = {
                    contestField: contestField,
                    contestRound: contestRound,
                    name: name,
                    newItem: newItem
                };

                $.ajax({
                    url: '/alr20/admin/evaluation/table/modify/all',
                    method: 'POST',
                    data: JSON.stringify(data),
                    dataType: 'json',
                    contentType: 'application/json; charset=utf-8',
                    success: function (res) {
                        alert(res.message);
                        location.reload();
                        $('#bordered-insert-eval-item').modal('hide');
                    },
                    error: function (res) {
                        alert(res.responseJSON.message);
                        $('#bordered-insert-eval-item').modal('hide');
                    }
                });

            } else {
                const name = $('#modifyItem option:selected').val();
                const description = $('#modifyIndicator option:selected').val();
                const newDescription = $('#newIndicator').val();
                const newPoint = $('#newPoint').val();
                const newDifferentialPoint = $('#newDifferentialPoint').val();
                const newGrade = $('#newGrade').val();

                data = {
                    contestField: contestField,
                    contestRound: contestRound,
                    name: name,
                    description: description,
                    newDescription: newDescription,
                    point: newPoint,
                    differentialPoint: newDifferentialPoint,
                    grade: newGrade
                };

                $.ajax({
                    url: '/alr20/admin/evaluation/table/modify/item',
                    method: 'POST',
                    data: JSON.stringify(data),
                    dataType: 'json',
                    contentType: 'application/json; charset=utf-8',
                    success: function (res) {
                        alert(res.message);
                        location.reload();
                        $('#bordered-insert-eval-item').modal('hide');
                    },
                    error: function (res) {
                        alert(res.responseJSON.message);
                        $('#bordered-insert-eval-item').modal('hide');
                    }
                });
            }
        });


        $("#deleteItem").change(function() {
            if( $("#deleteCheckbox").prop("checked")  ){
                $('#deleteIndicator option').remove();

                const check = $('#deleteItem option:selected').val();

                let addOption = "";
                /*[# th:each="list : ${final}"]*/
                if ( [[${list.name}]] === check) {
                    addOption += "<option value = \"" + [[${list.description}]] + "\" >" + [[${list.description}]] +"</option>";
                }
                /*[/]*/

                $('#deleteIndicator').append(addOption);
            }
        });

        $("#modifyItem").change(function() {
            if( $("#modifyCheckbox").prop("checked")  ){
                $('#modifyIndicator option').remove();

                const check = $('#modifyItem option:selected').val();

                let addOption = "";
                /*[# th:each="list : ${final}"]*/
                if ( [[${list.name}]] === check) {
                    addOption += "<option value = \"" + [[${list.description}]] + "\" >" + [[${list.description}]] +"</option>";
                }
                /*[/]*/

                $('#modifyIndicator').append(addOption);
            }
        });

        $('#union').click(function(){

            const value = $('#unionContestField option:selected').val();

            if(confirm( $('#unionContestField option:selected').text() +" 예선평가표 항목을 가져옵니다.")) {
                $.ajax({
                    url: '/alr20/admin/evaluation/standard/main/union/' + value,
                    method: 'POST',
                    dataType: 'json',
                    contentType: 'application/json; charset=utf-8',
                    success: function (res) {
                        location.reload();
                    },
                    error: function (res) {
                        alert(res.responseJSON.message);
                    }
                });
            }
        });

        $('#addSubmit').click(function () {

            let data;

            const isPublic = ($('#designatedFilter option:selected').val()==="public");
            let contestField;
            //지정공모, 자유공모 구분
            if(isPublic){
                contestField = "AIRSPACE";
            } else {
                contestField = "DESIGNATED_1";
            }

            const contestRound = "MAIN";

            if($('#addCheckbox').attr("aria-expanded") === 'false') {
                const name = $('#name').val();
                const description = $('#description').val();
                const point = $('#point').val();
                const differentialPoint = $('#differentialPoint').val();
                const grade = $('#grade').val();

                data = {
                    contestField: contestField,
                    contestRound: contestRound,
                    name: name,
                    description: description,
                    point: point,
                    differentialPoint: differentialPoint,
                    grade: grade
                };

                $.ajax({
                    url: '/alr20/admin/evaluation/table/register/all',
                    method: 'POST',
                    data: JSON.stringify(data),
                    dataType: 'json',
                    contentType: 'application/json; charset=utf-8',
                    success: function (res) {
                        alert(res.message);
                        location.reload();
                        $('#bordered-insert-eval-item').modal('hide');
                    },
                    error: function (res) {
                        alert(res.responseJSON.message);
                        $('#bordered-insert-eval-item').modal('hide');
                    }
                });

            } else {
                const name = $('#item option:selected').val();
                const description = $('#addDescription').val();
                const point = $('#addPoint').val();
                const differentialPoint = $('#addDifferentialPoint').val();
                const grade = $('#addGrade').val();

                data = {
                    contestField: contestField,
                    contestRound: contestRound,
                    name: name,
                    description: description,
                    point: point,
                    differentialPoint: differentialPoint,
                    grade: grade
                };

                $.ajax({
                    url: '/alr20/admin/evaluation/table/register/item',
                    method: 'POST',
                    data: JSON.stringify(data),
                    dataType: 'json',
                    contentType: 'application/json; charset=utf-8',
                    success: function (res) {
                        alert(res.message);
                        location.reload();
                        $('#bordered-insert-eval-item').modal('hide');
                    },
                    error: function (res) {
                        alert(res.responseJSON.message);
                        $('#bordered-insert-eval-item').modal('hide');
                    }
                });
            }
        });

        $('#deleteSubmit').click(function() {

            const item = $('#deleteItem option:selected').val();
            const indicator = $('#deleteIndicator option:selected').val();
            const isPublic = ($('#designatedFilter option:selected').val()==="public");
            let contestField;
            //지정공모, 자유공모 구분
            if(isPublic){
                contestField = "AIRSPACE";
            } else {
                contestField = "DESIGNATED_1";
            }

            if ($("input:checkbox").is(':checked') ) {
                if (confirm("평가항목 " + item + "의 " + indicator + " 평가지표가 삭제됩니다")) {

                    const data = {
                        isAll : false,
                        item : item,
                        indicator : indicator,
                        contestField : contestField
                    }

                    $.ajax({
                        url:"/alr20/admin/evaluation/standard/MAIN/delete",
                        method:'POST',
                        data: JSON.stringify(data),
                        dataType: 'json',
                        contentType: 'application/json; charset=utf-8',
                        success: function(res) {
                            alert(res.message);
                            location.reload();
                        },
                        error: function(res) {
                            alert(res.responseJSON.message);
                        }
                    });

                } else {
                    $('#bordered-delete-eval-item').modal('hide');
                }
            } else {
                if (confirm("평가항목 " + item + " 및 하위 평가항목이 삭제됩니다")) {
                    const data = {
                        isAll : true,
                        item : item,
                        contestField : contestField
                    }

                    $.ajax({
                        url:"/alr20/admin/evaluation/standard/MAIN/delete",
                        method:'POST',
                        data: JSON.stringify(data),
                        dataType: 'json',
                        contentType: 'application/json; charset=utf-8',
                        success: function(res) {
                            alert(res.message);
                            location.reload();
                        },
                        error: function(res) {
                            alert(res.responseJSON.message);
                        }
                    });
                } else {
                    $('#bordered-delete-eval-item').modal('hide');
                }
            }
        });

        $('#register').click(function () {
            if (confirm("본선 평가표가 갱신됩니다")) {

                const isPublic = ($('#designatedFilter option:selected').val()==="public");
                let contestField;
                //지정공모, 자유공모 구분
                if(isPublic){
                    contestField = "AIRSPACE";
                } else {
                    contestField = "DESIGNATED_1";
                }

                const data = {
                    contestRound: "MAIN",
                    contestField: contestField
                }

                $.ajax({
                    url: '/alr20/admin/evaluation/standard/register',
                    method: 'POST',
                    data: JSON.stringify(data),
                    dataType: 'json',
                    contentType: 'application/json; charset=utf-8',
                    success: function (res) {
                        alert(res.message);
                        location.reload();
                        $('#bordered-insert-eval-item').modal('hide');
                    },
                    error: function (res) {
                        alert(res.responseJSON.message);
                        $('#bordered-insert-eval-item').modal('hide');
                    }
                });
            }
        });

        $('.modal').on('hidden.bs.modal', function (e) {
            $('input:checked').prop('checked', false);

            $("input[aria-expanded=true]").each(function() {
                $(this).addClass('collapsed');
                $(this).attr('aria-expanded', false);
            });

            // $("form select option").remove();

            $("#collapseIndicator").removeClass('show');

            $('#addAll').addClass('show');
            $('#exceptItem').removeClass('show');

            $('#orderItem').addClass('show');
            $('#orderIndicator').removeClass('show');


            $('input').each(function () {
                $(this).val('')
            });
        });
    });
</script>

<style>

    button svg{
        margin-right: 0.35rem;
    }

    button {
        margin-right: 0.5rem;
    }

    #designatedFilter {
        float: right;
        width: auto;
    }

    #buttonGroup {
        margin-block: 1rem;
    }

    .col-sm-3 {
        width : auto;
    }

</style>

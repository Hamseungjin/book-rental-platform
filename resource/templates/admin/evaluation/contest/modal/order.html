<div class="modal fade" id="bordered-order-eval-item">
    <div class="modal modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">순서변경</h5>
                <div class="col-sm-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" data-bs-toggle="collapse" data-bs-target=".multiple-collapse" aria-expanded="false" aria-controls="orderItem orderIndicator" id="orderCheckbox">
                        <label class="form-check-label">평가지표 순서변경</label>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <form>
                    <div class="collapse show multiple-collapse" id="orderItem">
                        <th:block th:each="num : ${ #numbers.sequence(1,itemCount) }">
                            <div class="row mb-3">
                                <label class="col-sm-4 col-form-label" th:text="${numStat.count + '순위'}"></label>
                                <div class="col-sm-8">
                                    <select class="form-select indicator">
                                        <option th:each="list:${itemList}" th:value="${list}" th:text="${list}"></option>
                                    </select>
                                </div>
                            </div>
                        </th:block>
                    </div>

                    <div class="collapse multiple-collapse" id="orderIndicator">
                        <div class="row mb-3">
                            <label class="col-sm-4 col-form-label">평가항목</label>
                            <div class="col-sm-8">
                                <select class="form-select" id="itemMenu">
                                    <option th:each="list:${itemList}" th:value="${list}" th:text="${list}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="indicatorList">

                        </div>
                    </div>

                </form>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary resetData" data-bs-dismiss="modal" id="reset">닫기</button>
                    <button type="button" class="btn btn-primary" id="orderSubmit">저장</button>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    .modal-body .col-form-label {
        text-align: center;
    }
</style>

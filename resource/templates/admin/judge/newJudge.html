<div class="modal fade" id="bordered-new-judge">
  <div class="modal modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">심사위원 추가</h5>
      </div>

      <div class="modal-body">

        <form>
          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">분야</label>

            <div class="col-sm-10">
              <select class="form-select" id="contestRound">
                <option value="PRELIMINARY">예선</option>
                <option value="MAIN">본선</option>
              </select>
            </div>
          </div>

          <div class="row mb-3 collapse show" id = "selectContestField">
            <label class="col-sm-2 col-form-label">심사분야</label>

            <div class="col-sm-10">
              <select class="form-select" id="contestField">
                <option th:each="data : ${contestFieldType}" th:value="${data.key}" th:text="${data.value}"></option>
              </select>
            </div>
          </div>

          <div class="row mb-3 collapse hide" id = "selectMainPublic">
            <label class="col-sm-2 col-form-label">공모분야</label>

            <div class="col-sm-10">
              <select class="form-select" id="isPublic">
                <option value="public">자유공모</option>
                <option value="designated">지정공모</option>
              </select>
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">이름</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="name">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">아이디</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="userId">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">직급</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="rank">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">휴대전화</label>
            <div class="col-sm-10">
              <input type="text" class="form-control phoneNumber" id="phone">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">소속</label>
            <div class="col-sm-10">
              <input type="email" class="form-control" id="mainGroup">
            </div>
          </div>

        </form>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="reset">닫기</button>
          <button type="button" class="btn btn-primary" id="submit">저장</button>
        </div>

      </div>
    </div>
  </div>
</div>

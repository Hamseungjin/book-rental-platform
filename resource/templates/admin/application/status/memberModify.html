<!-- 비밀번호 초기화 -->
<div class="modal fade" id="bordered-modify-member">
  <div class="modal modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">멤버정보수정</h5>
      </div>

      <div class="modal-body">

        <form>
          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">이름</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="name">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">신분</label>

            <div class="col-sm-10">
              <select class="form-select" id="memberRank">
                <option th:each="data : ${memberRankType}" th:value="${data.key}" th:text="${data.value}"></option>
              </select>
            </div>
          </div>

          <div class="row mb-3" id = "selectLeader">
            <label class="col-sm-2 col-form-label">직급</label>

            <div class="col-sm-10">
              <select class="form-select" disabled id="memberRole">
                <option value="LEADER">팀장</option>
                <option value="MEMBER">팀원</option>
              </select>
            </div>

          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">생년월일</label>
            <div class="col-sm-10">
              <input type="date" class="form-control" id="birthday">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">휴대전화</label>
            <div class="col-sm-10">
              <input type="text" class="form-control phoneNumber" id="phone">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">메일주소</label>
            <div class="col-sm-10">
              <input type="email" class="form-control" id="mail">
            </div>
          </div>

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label">소속</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="group">
            </div>
          </div>
        </form>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="reset">닫기</button>
          <button type="button" class="btn btn-primary" id="submit">저장</button>
        </div>

      </div>
    </div>
  </div>
</div>

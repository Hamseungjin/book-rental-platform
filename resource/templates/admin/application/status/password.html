<!-- 비밀번호 초기화 -->
<div class="modal fade" id="bordered-password" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">비밀번호 초기화</h5>
            </div>
            <div class="modal-body">

                <form>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="비밀번호">
                        <label for="floatingPassword">신규 비밀번호</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="floatingPasswordRe" placeholder="비밀번호확인">
                        <label for="floatingPassword">비밀번호 확인</label>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-warning" id="init">비밀번호 초기화</button>
                <button type="button" class="btn btn-primary" id="save">저장</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    $(document).ready(function() {
       $('#init').click(function() {
           if (confirm("초기비밀번호(보안12!@)로 초기화됩니다")) {

               const teamName = [[${teamName}]];
               const data = {
                   isInitPassword : true,
                   teamName : teamName
               };

               $.ajax({
                   url: '/alr20/admin/passwordInit',
                   method:'POST',
                   data: JSON.stringify(data),
                   dataType: 'json',
                   contentType: 'application/json; charset=utf-8',
                   success: function(res) {
                       alert(res.message);
                       $('#bordered-password').modal('hide');
                   },
                   error: function(res) {
                       alert(res.responseJSON.message);
                   }
               });
           }
       });

       $('#save').click(function() {
            if(confirm("입력하신 비밀번호로 초기화됩니다")) {

                const teamName = [[${teamName}]];
                const password = $('#floatingPassword').val();
                const passwordCheck = $('#floatingPasswordRe').val();

                const data = {
                    isInitPassword: false,
                    teamName: teamName,
                    password: password,
                    passwordCheck: passwordCheck
                };

                $.ajax({
                    url: '/alr20/admin/passwordInit',
                    method: 'POST',
                    data: JSON.stringify(data),
                    dataType: 'json',
                    contentType: 'application/json; charset=utf-8',
                    success: function (res) {
                        alert(res.message);
                        $('#bordered-password').modal('hide');
                    },
                    error: function (res) {
                        alert(res.responseJSON.message);
                    }
                });
            }
           $('#floatingPassword').val('');
           $('#floatingPasswordRe').val('');

       });
    });
</script>

<style>
    .btn-warning:hover {
        color: #fff;
    }

    .btn-warning {
        color: #fff;
    }
</style>
